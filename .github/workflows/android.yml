name: Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','audio/**','app/**','.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - kind: offline   # 게임을 앱 안에 넣은 버전 (스토어용과 같은 방식)
            tag: app-test
            file: wordyzoo-test.apk
            title: 워디 주 테스트 앱 (인터넷 없이 돌아가는 버전)
          - kind: live      # 켤 때마다 깃허브 사이트에서 최신 게임을 불러오는 버전
            tag: app-live
            file: wordyzoo-live.apk
            title: 워디 주 실시간 테스트 앱
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Prepare web files
        working-directory: app
        run: |
          mkdir -p www assets
          cp ../index.html ../privacy.html ../manifest.webmanifest www/
          cp -r ../audio ../icons ../fonts www/
          # 앱 안에서는 서비스워커(웹 캐시)가 필요 없음
          sed -i "s#<script>if('serviceWorker' in navigator)[^<]*</script>##" www/index.html
          cp ../icons/icon-512.png assets/icon-only.png
          cp ../icons/maskable-512.png assets/icon-foreground.png
          cp icon-background.png assets/icon-background.png
          cp ../icons/maskable-512.png assets/splash.png
          cp ../icons/maskable-512.png assets/splash-dark.png
      - name: Live version settings
        if: matrix.kind == 'live'
        working-directory: app
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open('capacitor.config.json'))
          c['appId']='com.jjbros.wordyzoo.live'; c['appName']='워디 주 테스트'
          c['server']={'url':'https://jjang0442-code.github.io/wordyzoo/','cleartext':False}
          json.dump(c,open('capacitor.config.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Add Android
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FFF6EA' --splashBackgroundColor '#FFF6EA' || echo "icon generation skipped"
          npx cap sync android
          # 구글 플레이 요구: Android 16(API 36) 대상
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle
          cat android/variables.gradle
          # 세로 화면 고정
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          V=$(date +%y%m%d%H)
          sed -i "s/versionCode 1$/versionCode $V/; s/versionName \"1.0\"/versionName \"1.0-test.$V\"/" android/app/build.gradle
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.file }}
      - name: Publish to test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.title }}
          prerelease: true
          body: 폰에서 이 페이지를 열고 아래 ${{ matrix.file }} 를 눌러 내려받아 설치하세요. (설치 중 '출처를 알 수 없는 앱 허용'을 켜야 해요)
          files: ${{ matrix.file }}
