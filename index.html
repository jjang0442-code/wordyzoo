<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E5"><title>워디 주 (Wordy Zoo)</title>
<meta name="description" content="6~10세 아이를 위한 영어 단어 동물원 게임">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="워디 주">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --cream:#FFF6E5; --ink:#3D2E28; --muted:#8C7A6B; --line:#EADBC4;
  --orange:#FF8A3D; --orange-d:#E06A1F; --green:#4CB963; --green-d:#349A4B;
  --red:#F2665E; --blue:#4A9FE8; --blue-d:#2F7FC6; --sun:#FFC845; --pink:#FF9DB5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:'Jua',system-ui,sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.en{font-family:'Fredoka','Jua',sans-serif;font-weight:600}
button{font-family:inherit;touch-action:manipulation}
#app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.screen{flex:1;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));animation:scrIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.art{width:100%;height:100%;display:block;overflow:visible}
.grow{flex:1} .center{text-align:center} .muted{color:var(--muted)} .small{font-size:15px}
h1,h2,h3{margin:0;font-weight:400}

/* 버튼 */
.btn{appearance:none;border:0;cursor:pointer;font-size:22px;color:#fff;background:var(--orange);border-radius:22px;padding:15px 22px;
  box-shadow:0 6px 0 var(--orange-d);transition:transform .08s,box-shadow .08s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
.btn.green{background:var(--green);box-shadow:0 6px 0 var(--green-d)} .btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)} .btn.blue:active{box-shadow:0 2px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line)} .btn.ghost:active{box-shadow:0 2px 0 var(--line)}
.btn.big{font-size:25px;padding:19px 24px;border-radius:26px;width:100%}
.btn[disabled]{filter:grayscale(.9) opacity(.55);pointer-events:none}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.icon-btn{appearance:none;border:0;background:#fff;border-radius:16px;width:50px;height:50px;font-size:22px;box-shadow:0 4px 0 var(--line);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* 상단 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.topbar .mid{flex:1;display:flex;justify-content:center}
.pill{background:#fff;border-radius:999px;padding:8px 13px;font-size:19px;box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill.test{font-size:14px;background:#FFF0E3;color:var(--orange-d);box-shadow:0 3px 0 #F5D3B8;cursor:pointer}
.star{color:#F4B400}

/* 엘리 */
.ellie-row{display:flex;align-items:flex-end;gap:8px}
.ellie{width:92px;height:92px;flex:none}
.ellie.sm{width:70px;height:70px} .ellie.lg{width:170px;height:170px}
.ellie.talking .trunk{animation:trunk .35s ease-in-out infinite alternate}
@keyframes trunk{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.ellie .ear-l{animation:earL 3.2s ease-in-out infinite}.ellie .ear-r{animation:earR 3.2s ease-in-out infinite}
@keyframes earL{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-10deg)}}
@keyframes earR{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(10deg)}}
.bubble{position:relative;background:#fff;border-radius:22px;padding:13px 16px;font-size:20px;line-height:1.45;box-shadow:0 4px 0 var(--line);flex:1;min-height:56px;cursor:pointer}
.bubble:after{content:"";position:absolute;left:-9px;bottom:20px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble b{color:var(--orange-d);font-weight:400}

/* 움직임 공통 */
.art .blink{animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.art .tail{animation:wag 1.4s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.jump{animation:jump .55s cubic-bezier(.3,.8,.4,1)}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-28px) scale(.95,1.06)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* 타이틀 */
.title-screen{justify-content:center;align-items:center;gap:10px;background:radial-gradient(circle at 50% 35%,#FFFFFF 0,#FFF6E5 60%)}
.logo{font-size:56px;color:var(--orange);text-shadow:0 4px 0 #F5D3B8;line-height:1;text-align:center}
.logo small{display:block;font-size:24px;color:var(--muted);text-shadow:none;margin-top:6px}
.tap-hint{font-size:22px;color:var(--muted);animation:blinkTxt 1.6s infinite}
@keyframes blinkTxt{50%{opacity:.35}}

/* 온보딩 */
input.name{font-family:inherit;font-size:30px;text-align:center;border:3px solid var(--line);border-radius:22px;padding:14px;width:100%;outline:none;background:#fff;color:var(--ink)}
input.name:focus{border-color:var(--orange)}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.age{font-size:30px;padding:16px 0;border-radius:20px;background:#fff;border:3px solid var(--line);cursor:pointer;text-align:center;box-shadow:0 4px 0 var(--line)}
.age.on{border-color:var(--orange);background:#FFF0E3;transform:translateY(-3px)}

/* 동물원 */
.zoo{position:relative;border-radius:28px;overflow:hidden;flex:1;min-height:330px;box-shadow:0 6px 0 rgba(0,0,0,.06)}
.zoo .backdrop{position:absolute;inset:0;width:100%;height:100%}
.pal{position:absolute;width:86px;height:86px;margin-left:-43px;margin-top:-80px;cursor:pointer;transition:left 3.2s linear,top 3.2s linear}
.pal .flip{width:100%;height:100%;transition:transform .3s}
.pal.left .flip{transform:scaleX(-1)}
.pal.walking .body{animation:walk .4s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-4px) rotate(2deg)}}
.pal .body{width:100%;height:100%;transform-origin:50% 95%}
.pal .say{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:5px 10px;font-size:18px;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,.1);animation:pop .35s both;z-index:5;text-align:center}
.pal .say .h{display:block;font-size:12px}
.decor{position:absolute;pointer-events:none}
.zoo-msg{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:19px;color:#2f5a2a;padding:0 24px}
.zoo-egg{position:absolute;left:50%;top:60%;width:70px;height:76px;margin-left:-35px;animation:eggWob 2.2s ease-in-out infinite}
.home-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.home-actions .btn{flex-direction:column;font-size:17px;padding:10px 4px 8px;gap:0}
.home-actions .btn .ic{width:40px;height:40px}

/* 지도 */
.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.zone{border-radius:24px;padding:12px 14px 14px;min-height:170px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.08);position:relative;overflow:hidden}
.zone .za{height:84px;margin-bottom:6px}
.zone .zn{font-size:22px} .zone .zs{font-size:14px;opacity:.8}
.zone.locked .za{filter:grayscale(1) opacity(.45)}
.zone.locked{background:#EDE6DA!important;cursor:default}
.zone .lock{position:absolute;right:12px;top:10px;font-size:24px}
.bar{height:12px;background:rgba(255,255,255,.7);border-radius:8px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .6s}

/* 진행 */
.progress{display:flex;gap:5px;flex:1}
.progress i{flex:1;height:12px;border-radius:8px;background:#EADBC4;transition:background .3s}
.progress i.done{background:var(--green)} .progress i.now{background:var(--orange)} .progress i.miss{background:#F7B2A8}
.bowl{position:relative;width:54px;height:50px;flex:none}
.bowl .n{position:absolute;right:-4px;top:-6px;background:var(--orange);color:#fff;border-radius:999px;font-size:14px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bowl.bump{animation:jump .45s}

/* 배우기 */
.wordcard{background:#fff;border-radius:32px;box-shadow:0 8px 0 var(--line);padding:18px 18px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  animation:flipIn .55s cubic-bezier(.3,1.3,.5,1) both;perspective:600px}
@keyframes flipIn{from{transform:rotateY(80deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.wordcard .pic{width:200px;height:200px}
.wordcard .word{font-size:56px;letter-spacing:1px}
.wordcard .word span{display:inline-block;transition:color .15s,transform .15s}
.wordcard .word span.lit{color:var(--orange);transform:translateY(-6px) scale(1.12)}
.wordcard .ko{font-size:24px;color:var(--muted)}
.speaker{display:inline-flex;align-items:center;gap:6px;background:#EAF5FF;color:var(--blue-d);border-radius:999px;padding:9px 18px;font-size:19px;margin-top:6px}

/* 문제 */
.quiz{display:flex;flex-direction:column;flex:1}
.q-prompt{display:flex;align-items:center;justify-content:center;gap:14px;min-height:150px}
.q-pic{width:150px;height:150px}
.q-listen{appearance:none;border:0;cursor:pointer;width:128px;height:128px;border-radius:50%;background:var(--blue);box-shadow:0 8px 0 var(--blue-d);color:#fff;
  display:flex;align-items:center;justify-content:center}
.q-listen.sm{width:76px;height:76px;box-shadow:0 5px 0 var(--blue-d)}
.q-listen svg{width:56%;height:56%}
.q-listen:active{transform:translateY(5px);box-shadow:0 3px 0 var(--blue-d)}
.q-listen.playing{animation:ring 1s ease-out}
@keyframes ring{0%{box-shadow:0 8px 0 var(--blue-d),0 0 0 0 rgba(74,159,232,.5)}100%{box-shadow:0 8px 0 var(--blue-d),0 0 0 26px rgba(74,159,232,0)}}
.q-text{font-size:21px;text-align:center;margin:8px 0 14px;min-height:30px}
.q-text.hint{color:var(--orange-d)}
.opts{display:grid;gap:12px}
.opts.c3{grid-template-columns:repeat(3,1fr)} .opts.c2{grid-template-columns:repeat(2,1fr)}
.opt{appearance:none;border:4px solid transparent;cursor:pointer;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);padding:10px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;min-height:118px;transition:transform .1s,opacity .3s,border-color .2s}
.opt:active{transform:translateY(3px)}
.opt .oa{width:96px;height:96px}
.opt.txt{font-size:32px}
.opt.right{border-color:var(--green);background:#EAF8EC}
.opt.wrong{border-color:var(--red);background:#FDECEB}
.opt.dim{opacity:.35;pointer-events:none}
.opt.sel{border-color:var(--blue);background:#EAF5FF}
.opt.snd{flex-direction:column;gap:4px;font-size:26px;color:var(--blue-d)}
.opt.snd svg{width:44px;height:44px}
.firstl{font-size:60px;letter-spacing:3px}
.firstl b{display:inline-block;min-width:50px;border-bottom:5px solid var(--orange);color:var(--orange);font-weight:600}
.spell-slots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:4px 0 16px}
.slot{width:48px;height:58px;border-radius:14px;border:3px dashed #D9C6A8;display:flex;align-items:center;justify-content:center;font-size:32px;background:#fff;transition:all .15s}
.slot.fill{border-style:solid;border-color:var(--orange);cursor:pointer}
.slot.fixed{border-style:solid;border-color:#BFE3A8;background:#F1FAEA;color:var(--green-d)}
.slot.ok{border-color:var(--green);background:#EAF8EC}
.tiles{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.tile{appearance:none;border:0;cursor:pointer;width:56px;height:62px;border-radius:16px;background:var(--sun);box-shadow:0 5px 0 #D9A21E;font-size:32px;color:var(--ink);font-family:'Fredoka',sans-serif;font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #D9A21E}
.tile.used{visibility:hidden}

.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:820px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;
  display:flex;align-items:center;gap:12px;animation:slideUp .28s cubic-bezier(.2,.9,.3,1.1);z-index:20;box-shadow:0 -6px 0 rgba(0,0,0,.04)}
.sheet.ok{background:#DFF5E3} .sheet.no{background:#FFE8E3}
.sheet .msg{flex:1;font-size:21px;line-height:1.35}
.sheet .msg .en{font-size:28px}
@keyframes slideUp{from{transform:translate(-50%,110%)}to{transform:translate(-50%,0)}}
.combo{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:35;font-size:40px;color:#fff;background:linear-gradient(135deg,#FF8A3D,#F2504A);
  padding:14px 26px;border-radius:24px;box-shadow:0 8px 0 #B8322E;animation:comboIn 1.4s ease both;pointer-events:none;white-space:nowrap}
@keyframes comboIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.flyer{position:fixed;z-index:40;pointer-events:none;width:80px;height:80px;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s}

/* 결과·알·먹이 */
.card{background:#fff;border-radius:26px;box-shadow:0 6px 0 var(--line);padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:#fff;border-radius:999px;padding:6px 12px 6px 6px;font-size:19px;box-shadow:0 3px 0 var(--line);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip .ca{width:30px;height:30px}
.eggbox{width:190px;height:206px;cursor:pointer;margin:0 auto}
.eggbox.idle{animation:eggWob 2s ease-in-out infinite}
.eggbox.hit{animation:eggHit .45s}
@keyframes eggWob{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-7deg)}86%{transform:rotate(7deg)}94%{transform:rotate(-3deg)}}
@keyframes eggHit{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.06)}60%{transform:rotate(10deg) scale(.97)}}
.burst{position:relative;width:220px;height:220px;margin:0 auto}
.burst .newpal{position:absolute;inset:10px;animation:hatch .8s cubic-bezier(.3,1.6,.5,1) .15s both}
@keyframes hatch{from{transform:scale(.1) translateY(60px);opacity:0}to{transform:none;opacity:1}}
.burst .shell{position:absolute;width:90px;height:60px;top:110px;opacity:0}
.burst .shell.l{left:10px;animation:shellL .9s ease-out both} .burst .shell.r{right:10px;animation:shellR .9s ease-out both}
@keyframes shellL{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(-70px,80px) rotate(-70deg)}}
@keyframes shellR{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(70px,80px) rotate(70deg)}}
.rays{position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,212,59,.35) 0 12deg,transparent 12deg 30deg);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sparkle{position:absolute;font-size:26px;animation:spark 1.2s ease-out both;pointer-events:none}
@keyframes spark{0%{transform:scale(0);opacity:1}60%{opacity:1}100%{transform:scale(1.4) translateY(-30px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:11px;height:15px;border-radius:3px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(560deg)}}

.feedzoo{position:relative;border-radius:28px;overflow:hidden;height:330px;box-shadow:0 6px 0 rgba(0,0,0,.06)}
.feedzoo .backdrop{position:absolute;inset:0;width:100%;height:100%}
.feedpal{position:absolute;cursor:pointer;text-align:center}
.feedpal .fa{width:100%;height:100%}
.feedpal .hearts{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:15px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 7px;white-space:nowrap}
.feedpal.munch .fa{animation:munch .5s ease 2}
@keyframes munch{0%,100%{transform:scale(1)}30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.06)}}
.yum{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:22px;color:var(--orange-d);animation:yum 1s ease both;white-space:nowrap}
@keyframes yum{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0;min-height:52px}
.cookie{width:58px;height:58px;border-radius:50%;background:#F2C27A;box-shadow:inset 0 -5px 0 #D9A24F,0 3px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;padding:8px}
.cookie.next{outline:4px solid var(--orange);outline-offset:2px;animation:bob 1.2s ease-in-out infinite}

/* 도감·꾸미기 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:12px;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line);font-size:19px;cursor:pointer}
.tab.on{background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.cell{background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--line);padding:10px 6px;text-align:center;cursor:pointer}
.cell .ca{width:78px;height:78px;margin:0 auto}
.cell .cn{font-size:17px;margin-top:2px} .cell .ck{font-size:13px;color:var(--muted)}
.cell.none .ca{filter:brightness(0) opacity(.12)}
.cell.rare{background:linear-gradient(160deg,#FFF9E0,#F3ECFF)}
.stars{color:#F4B400;font-size:14px;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(61,46,40,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:scrIn .2s}
.modal{background:#fff;border-radius:30px;padding:22px;width:100%;max-width:400px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.1)}
.modal .ma{width:190px;height:190px;margin:0 auto}

/* 부모 */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px solid #F3E8D6;font-size:18px}
.row:last-child{border-bottom:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg span{padding:8px 12px;border-radius:12px;background:#F5ECDD;cursor:pointer;font-size:16px}
.seg span.on{background:var(--orange);color:#fff}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:#FFF6E5;border-radius:16px;padding:12px;text-align:center;font-size:14px;color:var(--muted)}
.stat b{display:block;font-size:30px;color:var(--ink);font-weight:400}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad .btn{font-size:28px;padding:14px 0}

</script><script>/* ===== 워디 주 그림 (직접 그린 벡터) =====

   - 테두리는 같은 계열의 진한 색

const INK='#3D2E28';
const SW='stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
const st=c=>`stroke="${c}" ${SW}`;
const E=(cx,cy,rx,ry,f,x='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${x}/>`;
const C=(cx,cy,r,f,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${x}/>`;
const P=(d,f,x='')=>`<path d="${d}" fill="${f}" ${x}/>`;
const shadow=(w=30)=>E(60,113,w,4.5,'rgba(61,46,40,.13)');

function eyes(y=50,dx=11,r=4.4,cx=60){
  return `<g class="blink" style="transform-origin:${cx}px ${y}px">
    ${E(cx-dx,y,r,r*1.12,INK)}${E(cx+dx,y,r,r*1.12,INK)}
    ${C(cx-dx+1.5,y-1.9,r*.36,'#fff')}${C(cx+dx+1.5,y-1.9,r*.36,'#fff')}</g>`;
}
const cheeks=(y=60,dx=19,cx=60)=>E(cx-dx,y,5.2,3.2,'#FF8FAB','opacity=".55"')+E(cx+dx,y,5.2,3.2,'#FF8FAB','opacity=".55"');
const smile=(y=66,w=4,cx=60)=>P(`M${cx-w} ${y} q${w} ${w} ${w*2} 0`,'none',`stroke="${INK}" stroke-width="2.2" stroke-linecap="round"`);

/* ---------- 네발 포유류 공통 ---------- */
function ears(o){

    case 'round': return `<g class="ear-l" style="transform-origin:40px 36px">${C(37,30,11,c,st(d))}${C(37,30,5.5,i)}</g><g class="ear-r" style="transform-origin:80px 36px">${C(83,30,11,c,st(d))}${C(83,30,5.5,i)}</g>`;
    case 'big':   return `<g class="ear-l" style="transform-origin:42px 40px">${C(31,36,15,c,st(d))}${C(31,36,9,i)}</g><g class="ear-r" style="transform-origin:78px 40px">${C(89,36,15,c,st(d))}${C(89,36,9,i)}</g>`;

function snout(o){

      <g stroke="${o.whisker||'#8C7A6B'}" stroke-width="1.6" stroke-linecap="round" opacity=".8"><path d="M44 60h-12M44 64l-11 3M76 60h12M76 64l11 3"/></g>`;
    case 'long':   return `${E(60,68,15,11.5,s,st(d))}${E(54,68,2.2,3,d)}${E(66,68,2.2,3,d)}${smile(73,3)}`;
    case 'wide':   return `${E(60,67,21,12.5,s,st(d))}${E(52,63,2.6,3.6,d)}${E(68,63,2.6,3.6,d)}${smile(72,5)}`;

function quad(o){
  const b=o.body, d=o.dark, bl=o.belly||o.body, leg=o.leg||b;

  return `<svg viewBox="0 0 120 120" class="art">${shadow(o.sh||28)}
    ${o.back||''}

    ${o.belly2||''}

    ${o.hoof?`<rect x="47" y="106" width="11" height="6" rx="3" fill="${o.hoof}"/><rect x="62" y="106" width="11" height="6" rx="3" fill="${o.hoof}"/>`:''}
    ${o.behindHead||''}

function verbArt(v,a){
  switch(v){
    case 'run':return comp(ground()+speed(34,58)+nest(a,26,20,82,{rot:-8})+C(20,104,6,'#E8D9A8')+C(10,100,4,'#E8D9A8'));
    case 'walk':return comp(ground()+[14,30].map((x,i)=>E(x,106-i*2,5,3,'#B8A880')).join('')+nest(a,30,18,84));
    case 'jump':return comp(ground()+P('M10 100 q30 -70 64 -50','none','stroke="#C9B9A0" stroke-width="3" stroke-dasharray="6 6"')+nest(a,36,2,74,{rot:-14}));
    case 'eat':return comp(ground()+ln('M100 112 V30','#8A5A2B',6)+E(98,26,22,14,'#6CC26A',st('#3F8A3E'))+nest(a,4,16,86)+P('M78 34 q8 -4 12 2 q-6 6 -12 -2z','#6CC26A',st('#3F8A3E'))+`<text x="62" y="20" font-family="Jua" font-size="13" fill="#3F8A3E">냠</text>`);
    case 'drink':return comp(ground()+E(36,104,30,8,'#8FD3FF',st('#5FA8D9'))+nest(a,30,22,82,{flip:true})+ln('M44 96 q-4 6 0 8','#5FA8D9',2));
    case 'sleep':{const sc=80/120,ex=x=>14+x*sc,ey=30+50*sc;return comp(ground()+nest(a,14,30,80).replace(/class="blink"/g,'class="noblink"')+E(ex(49),ey,4.4,4.4,'#F7C25B')+E(ex(71),ey,4.4,4.4,'#F7C25B')+P(`M${ex(49)-3.4} ${ey} q3.4 3 6.8 0 M${ex(71)-3.4} ${ey} q3.4 3 6.8 0`,'none',`stroke="${INK}" stroke-width="2" stroke-linecap="round"`)+zz(90,30))}
    case 'roar':return comp(ground()+nest(a,6,20,82)+P('M90 46 q10 10 0 20 M98 40 q14 16 0 32 M106 34 q18 22 0 44','none','stroke="#FF8A3D" stroke-width="3.4" stroke-linecap="round"'));
    case 'hide':return comp(ground()+nest(a,30,30,60)+[16,30,44,58,72,86,100].map((x,i)=>P(`M${x} 112 q${-4+i%3*4} -34 ${6} -${44+(i%3)*8} q4 30 10 ${44+(i%3)*8}z`,i%2?'#B8C860':'#9AB04A',st('#6E8A2E'))).join(''));
    case 'chase':return comp(ground()+nest('gazelle',64,30,52)+speed(70,50)+nest(a,0,26,66,{rot:-6})+speed(10,56));
    case 'rest':return comp(ground()+ln('M84 112 V40','#7A5A3E',6)+E(84,34,30,14,'#6CC26A',st('#3F8A3E'))+E(50,104,40,6,'rgba(0,0,0,.12)')+nest(a,16,40,70));
  }
  return comp(nest(a,10,10,100));
}

const _verbArt1=verbArt;
verbArt=function(v,a){
  const water=E(60,96,54,16,'#8FD3FF',st('#5FA8D9'))+ln('M16 92 q8 -4 16 0 M44 98 q8 -4 16 0 M76 92 q8 -4 16 0','#FFFFFF',2.4);
  const trunk=ln('M96 120 V0','#8A5A2B',14)+ln('M96 120 V0','#A8743E',8);
  switch(v){
    case 'swim':return comp(nest(a,22,24,74)+`<rect x="0" y="80" width="120" height="40" fill="#8FD3FF" opacity=".85"/>`+ln('M10 84 q10 -6 20 0 q10 6 20 0 q10 -6 20 0 q10 6 20 0 q10 -6 20 0','#FFFFFF',3));
    case 'fly':return comp(C(22,30,12,'#FFFFFF')+C(34,26,14,'#FFFFFF')+C(94,88,12,'#FFFFFF')+C(104,84,10,'#FFFFFF')+P('M14 96 q30 -40 60 -50','none','stroke="#C9B9A0" stroke-width="3" stroke-dasharray="6 6"')+nest(a,40,10,70,{rot:-12}));
    case 'climb':return comp(trunk+nest(a,44,26,64,{rot:-8})+ln('M70 112 l6 -14 M70 92 l6 -14','#C9B9A0',3));
    case 'sing':return comp(ground()+nest(a,4,22,82)+`<text x="84" y="40" font-size="22" fill="#9C6ADE">♪</text><text x="96" y="62" font-size="18" fill="#4A9FE8">♫</text><text x="80" y="76" font-size="16" fill="#FF8A3D">♪</text>`);
    case 'dance':return comp(ground()+nest(a,22,18,76,{rot:10})+P('M14 40 q6 -8 12 0 M100 46 q6 -8 12 0','none','stroke="#FF8FAB" stroke-width="3"')+`<text x="8" y="70" font-size="18" fill="#9C6ADE">♪</text><text x="100" y="80" font-size="18" fill="#4A9FE8">♫</text>`);
    case 'sit':return comp(ground()+`<rect x="22" y="78" width="76" height="20" rx="8" fill="#B07A44" ${st('#7A5233')}/>`+nest(a,24,10,72));
    case 'swing':return comp(ln('M0 10 H120','#8A5A2B',6)+P('M40 10 q-6 30 16 46','none','stroke="#4FA34D" stroke-width="5"')+nest(a,30,36,70,{rot:-20})+P('M100 70 q-10 10 -24 10','none','stroke="#C9B9A0" stroke-width="3" stroke-dasharray="5 5"'));
    case 'crawl':return comp(ground()+nest(a,20,40,78)+ln('M20 98 h-14 M24 104 h-18','#C9B9A0',3));
    case 'splash':return comp(nest(a,24,18,72)+water+[[20,70],[30,58],[96,64],[88,54],[60,52]].map(([x,y])=>P(`M${x} ${y} q5 6 0 10 q-5 -4 0 -10z`,'#8FD3FF',st('#5FA8D9'))).join(''));
    case 'hug':return comp(trunk.replace(/M96/g,'M70')+nest(a,30,30,66)+`<text x="14" y="36" font-size="20">💕</text>`);
  }
  return _verbArt1(v,a);
};

  else if(s.k==='have'){shuffle(pool.filter(x=>x.k==='have'&&!confusable(x.a,s.a))).slice(0,n).forEach(x=>out.push(x))}
  else{shuffle(pool.filter(x=>x.k===(s.k==='like'?'like':'isa')&&!confusable(x.a,s.a))).slice(0,n).forEach(x=>out.push(x))}
  while(out.length<n){const x=pick(pool.filter(x=>x.k===s.k));if(x&&!out.includes(x))out.push(x);else break}
  return out.slice(0,n);
}

/* ---------- 스테이지 만들기 ---------- */
let L=null;
function seenOther(ws){return WORDS.filter(w=>S.words[w.id]?.seen&&!ws.includes(w.id))}
function buildStage(id){
  const[zid,si]=id.split('-');const ws=STAGES[zid][+si];const lv=LEVELS[S.level];const replay=stageStars(id)>0;
  const steps=[];
  ws.forEach(w=>steps.push({t:'learn',w}));
  ws.forEach((w,i)=>steps.push({t:'q',w,type:i<2?'listen':lv.types[(i+1)%lv.types.length]}));
  steps.push(...[0,1,2,3].map(r=>({t:'balloon',r})));
  // 문장: 이번 스테이지 단어가 들어간 문장 우선
  const pool=SENT.filter(s=>s.zone===zid&&(ws.includes(s.a)||ws.includes(s.b)));
  const kinds=shuffle(['adj','fam','feel','qa','go','count','col','wx','day']).concat(S.level===0?['can','like','isa','have','size','pos','two']:['can','have','pos','like','size','two','isa']);
  const chosen=[];for(const k of kinds){const c=shuffle(pool.filter(s=>s.k===k&&!chosen.includes(s)))[0];if(c)chosen.push(c);if(chosen.length===2)break}
  if(chosen.length<2)chosen.push(...shuffle(SENT.filter(s=>s.zone===zid&&!chosen.includes(s))).slice(0,2-chosen.length));
  chosen.forEach((s,i)=>{steps.push({t:'slearn',s:s.id});steps.push({t:'sq',s:s.id,type:lv.sTypes[(i+(+si))%lv.sTypes.length]})});
  // 복습: 예전에 배운 단어 중 복습할 때가 된 것 → 없으면 오늘 단어
  const due=seenOther(ws).filter(w=>S.words[w.id].due<=today()).sort((a,b)=>S.words[a.id].due.localeCompare(S.words[b.id].due)).map(w=>w.id);
  const rv=[...due,...shuffle(seenOther(ws).map(w=>w.id)),...shuffle(ws)].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4);
  rv.forEach((w,i)=>steps.push({t:'q',w,type:lv.types[(i+2)%lv.types.length],review:true}));
  const animals=ws.filter(w=>['animal','bird'].includes(WORD[w].cat)||(zid==='sea'&&WORD[w].cat==='water'&&!['clam','oyster'].includes(w)));
  const rescue=animals.find(a=>!S.pals.some(p=>p.id===a))||PALS0.find(a=>!S.pals.some(p=>p.id===a))||animals[0]||'bear';
  const _L={id,zid};const sit=sitOf(_L);
  prefetch([...new Set(steps.flatMap(x=>x.w?[x.w]:x.s?['s_'+x.s]:[]).concat(ws))]);
  return{t0:Date.now(),sit,id,zid,ws,steps,i:-1,food:[],firstTry:0,total:0,said:0,speakTotal:0,combo:0,result:{},rescue,replay,miss:{}};
}

  xylophone:()=>svgWrap(`${ln('M14 92 L106 76 M14 52 L106 36','#8A5A2B',4)}${['#FF6B6B','#FF9F43','#FFD43B','#6CC26A','#4A9FE8','#9C6ADE'].map((c,i)=>`<rect x="${20+i*14}" y="${30+i*-2.6+ (5-i)*0}" width="11" height="${62-i*6}" rx="3" fill="${c}" ${st('#5A4638')} transform="translate(0 ${i*0.4})"/>`).join('')}
    ${ln('M78 16 L96 34','#8A5A2B',3)}${C(76,14,5,'#FF6B6B',st('#C94848'))}`,40),
  yoyo:()=>svgWrap(`${ln('M60 8 V40','#8A5A2B',2)}${C(60,8,4,'none',st('#8A5A2B'))}${C(60,66,34,'#FF6B6B',st('#C94848'))}${C(60,66,22,'#FF8F8F',st('#C94848'))}${C(60,66,6,'#FFFFFF',st('#C94848'))}${miniFace(60,86,.7)}`,30),
});

/* ---------- 단어 쓰기: 배운 짧은 단어(3~5글자)를 한 글자씩 따라 쓰기 + 빈칸 채우기 ---------- */
const WT_START=['cat','dog','pig','fox','bear','lion','frog','duck','egg','sun','bee','owl'];
function wtWords(){const ok=id=>WORD[id]&&/^[a-z]{3,5}$/.test(WORD[id].en)&&ART[id];
  const seen=Object.keys(S.words||{}).filter(id=>S.words[id].seen&&ok(id));
  const list=seen.length>=6?seen:[...new Set([...seen,...WT_START.filter(ok)])];
  return list.sort((a,b)=>(WORDS.findIndex(w=>w.id===a))-(WORDS.findIndex(w=>w.id===b)))}
const wtRec=id=>(S.wtr||{})[id]||{};
function rWtList(){const ws=wtWords(),done=ws.filter(id=>wtRec(id).t).length;
  $app.innerHTML=`<div class="screen" style="gap:12px"><div class="topbar"><button class="icon-btn" data-a="home">←</button><div class="mid" style="font-size:24px">ABC 따라 쓰기</div><div class="pill"><span class="en">${done}</span>/${ws.length}</div></div>
    <div class="abc-tabs"><button data-a="abc">글자 쓰기</button><button class="on">단어 쓰기 <span class="en small">${ws.length}</span></button></div>
    <div class="ellie-row">${ellie('happy','sm')}<div class="bubble" id="say" data-a="skipTalk"></div></div>
    <div class="wt-grid">${ws.map(id=>{const r=wtRec(id);return`<button class="wt-tile ${r.t?'done':''}" data-wt="${id}"><span class="wt-art">${art(id)}</span><b class="en">${WORD[id].en}</b>
      <span class="wt-badge">${r.b?'🏅':r.t?'✓':''}</span></button>`}).join('')}</div>
    <div class="small muted center">탐험에서 새 단어를 배우면 여기에 쌓여요 · ✓ 따라 쓰기 완료 · 🏅 빈칸 도전 성공</div></div>`;
  later(()=>talk(Object.keys(S.words||{}).some(id=>S.words[id].seen)?'탐험에서 배운 단어를 써 보자! 🏅를 모아 봐.':'먼저 쉬운 단어부터 써 보자! 탐험을 하면 단어가 더 늘어나.'),300)}
function rWordTrace(){
  const id=ctx.id,en=WORD[id].en,blank=ctx.blank;
  if(!TR||TR.word!==id||TR.mode!==(blank?'b':'t')){
    const bi=blank?(ctx.bi??(1+Math.floor(Math.random()*(en.length-1)))):-1;
    TR={word:id,mode:blank?'b':'t',chars:[...en],pos:blank?bi:0,bi,picked:!blank,miss:0,L:en[0],ch:en[0]};
    wtLoadChar()}
  const chars=TR.chars.map((c,i)=>{const cls=blank?(i!==TR.bi?'done':'now'):(i<TR.pos?'done':i===TR.pos?'now':'');
    return`<span class="wt-ch ${cls}">${blank&&i===TR.bi&&!TR.done?(TR.picked?c:'_'):c}</span>`}).join('');
  $app.innerHTML=`<div class="screen trace-screen"><div class="topbar"><button class="icon-btn" data-a="wtList">←</button>
      <div class="mid" style="font-size:20px">${blank?'빈칸 도전 🏅':'단어 따라 쓰기'}</div><button class="icon-btn" data-a="trDemo" aria-label="보여 주기">👀</button></div>
    <div class="trace-word" data-a="wtSay"><div class="tw-art">${art(id)}</div><div class="en wt-row">${chars}</div>${spkIcon(22)}</div>
    ${blank&&!TR.picked?`<div class="wt-pick">${wtChoices().map(c=>`<button class="en" data-wtpick="${c}">${c}</button>`).join('')}</div>`:''}
    <div class="trace-pad ${blank&&!TR.picked?'off':''}"><svg id="trSvg" viewBox="0 0 100 104" preserveAspectRatio="xMidYMid meet">
      <line x1="2" y1="40" x2="98" y2="40" class="tr-mid"/><line x1="2" y1="78" x2="98" y2="78" class="tr-base"/><line x1="2" y1="6" x2="98" y2="6" class="tr-top"/>
      <g id="trAll"><g id="trGuide">${TR.picked?TR.strokes.map(s=>`<path d="${s.d}" class="tr-guide"/>`).join(''):''}</g><g id="trDone"></g><path id="trInk" class="tr-ink" d=""/><g id="trHint"></g></g></svg></div>
    <div class="center muted" id="trMsg" style="font-size:19px;min-height:28px"></div>
    <div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" data-a="trReset">↺ 다시</button><button class="btn ghost" style="flex:1" data-a="trDemo">👀 보여 줘</button></div></div>`;
  if(TR.picked){drawTraceState();bindTrace()}
  if(!ctx.cont){later(()=>play(id),350);later(()=>trMsg(blank?`잘 듣고 <b>빈칸</b>에 들어갈 글자를 골라 봐!`:`<b class="en">${en}</b>! 첫 글자 <b class="en">${en[0]}</b>부터 써 보자`),500)}
  else later(()=>trMsg(`이번엔 <b class="en">${TR.chars[TR.pos]}</b>! 초록 점에서 시작해`),200);
}
function wtLoadChar(){const c=TR.chars[TR.pos];TR.ch=c;TR.L=c;TR.si=0;TR.idx=0;TR.done=false;TR.strokes=STROKES[c].map(sampleStroke);TR.onDone=wtCharDone}
function wtChoices(){const c=TR.chars[TR.bi];const pool='abcdefghijklmnopqrstuvwxyz'.split('').filter(x=>x!==c);
  const near={b:'dp',d:'bq',p:'qb',q:'pd',m:'nw',n:'mh',u:'vn',v:'uw',i:'jl',e:'ao',a:'eo',o:'ae',c:'ek',s:'zc',g:'jq'};const ds=[...(near[c]||'')].filter(x=>x!==c);
  while(ds.length<2){const x=pool[Math.floor(Math.random()*pool.length)];if(!ds.includes(x))ds.push(x)}
  if(!TR.opts)TR.opts=shuffle([c,...ds.slice(0,2)]);return TR.opts}
function wtCharDone(){sfx.ok();vib(15);
  if(TR.mode==='t'&&TR.pos<TR.chars.length-1){TR.wait=true;
    setTimeout(()=>{const all=$('#trAll');if(!all||!TR)return;all.classList.add('tr-out');
      setTimeout(()=>{if(!TR)return;TR.pos++;wtLoadChar();TR.wait=false;
        document.querySelectorAll('.wt-row .wt-ch').forEach((x,i)=>{x.classList.toggle('done',i<TR.pos);x.classList.toggle('now',i===TR.pos)});
        $('#trGuide').innerHTML=TR.strokes.map(s=>`<path d="${s.d}" class="tr-guide"/>`).join('');TR.hintIn=true;drawTraceState();
        all.classList.remove('tr-out');all.classList.add('tr-in');setTimeout(()=>all.classList.remove('tr-in'),450);
        trMsg(`이번엔 <b class="en">${TR.chars[TR.pos]}</b>! 초록 점에서 시작해`)},380)},700);return}
  const id=TR.word,blank=TR.mode==='b';S.wtr=S.wtr||{};const r=S.wtr[id]=S.wtr[id]||{};
  const st=blank?(TR.miss===0?3:2):(TR.miss===0?3:TR.miss<=3?2:1);if(blank)r.b=1;else r.t=Math.max(r.t||0,st);S.stars+=st;save();
  document.querySelectorAll('.wt-ch').forEach(x=>x.classList.add('done'));document.querySelectorAll('.wt-row .wt-ch').forEach((x,i)=>x.textContent=TR.chars[i]);
  document.querySelector('.trace-pad')?.classList.add('win');confetti(50);sfx.clap();later(()=>play(id),300);
  trMsg(`<b class="en">${WORD[id].en}</b> 완성! ${'★'.repeat(st)}`);
  const ws=wtWords(),nx=ws.find(x=>!wtRec(x).t&&x!==id);
  later(()=>{$app.insertAdjacentHTML('beforeend',`<div class="modal-bg"><div class="modal pop"><div style="width:110px;height:110px;margin:0 auto">${art(id)}</div>
    <div class="en" style="font-size:44px">${WORD[id].en}</div><div style="font-size:30px;color:#FFC21A">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    ${!blank?`<button class="btn big orange" data-wtb="${id}" style="width:100%;margin-top:10px">🏅 빈칸 도전하기</button>`:''}
    ${nx?`<button class="btn big green" data-wt="${nx}" style="width:100%;margin-top:10px">다음 단어 <span class="en">${WORD[nx].en}</span></button>`:''}
    <button class="btn ghost big" style="margin-top:10px;width:100%" data-a="wtList">단어 고르기</button></div></div>`)},1600)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-wt],[data-wtb],[data-wtpick],[data-a="wtList"],[data-a="wtSay"]');if(!t)return;e.stopImmediatePropagation();
  const d=t.dataset;document.querySelector('.modal-bg')?.remove();
  if(d.a==='wtList'){sfx.tap();TR=null;go('wtlist');return}
  if(d.a==='wtSay'){if(TR)play(TR.word);return}
  if(d.wt){sfx.tap();TR=null;go('wtrace',{id:d.wt,blank:false});return}
  if(d.wtb){sfx.tap();TR=null;go('wtrace',{id:d.wtb,blank:true});return}
  if(d.wtpick){if(!TR||TR.picked)return;if(d.wtpick===TR.chars[TR.bi]){sfx.ok();TR.picked=true;wtLoadChar();go('wtrace',{id:TR.word,blank:true,cont:true})}
    else{sfx.no();vib(30);TR.miss++;t.classList.add('wrong');t.disabled=true;trMsg('다시 들어 볼까? 🔊');later(()=>play(TR.word),300)}}},true);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
